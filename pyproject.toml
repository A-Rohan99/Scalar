[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendataopsenv"
version = "1.1.0"
description = "DataOps incident-response environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "faker>=24.0.0",
    "openai",
    "pandas>=2.2.2",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"
